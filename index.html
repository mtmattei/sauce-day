<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a18" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f3f0" media="(prefers-color-scheme: light)">
<title>Sauce Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,200..900;1,300..500&family=Chivo+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c1121f' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M14.5 8.44A7 7 0 1 0 14.5 20.56Z'/><path d='M11 7.6V4.4'/><path d='M11 7.6C9.4 6.2 7.7 5.9 6.1 6.3'/><path d='M11 7.6c1.4-1.2 2.9-1.6 4.4-1.3'/><path d='M18.4 8.9a6.2 6.2 0 0 1 0 11.2Z'/></svg>">
<link rel="preload" as="image" href="img/loader/sheet.png">
<style>
/* Critical splash CSS, inline so the black paints on the very first frame
   rather than after styles.css lands. Everything else waits its turn. */
#splash{position:fixed;inset:0;z-index:9999;background:#000;color:#fff8df;
  display:grid;place-items:center;padding:1.5rem;
  font-family:"Chivo Mono",ui-monospace,"Courier New",monospace;
  transition:opacity .45s ease,visibility .45s ease}
#splash.is-gone{opacity:0;visibility:hidden;pointer-events:none}
.sp-in{display:grid;justify-items:center;gap:.9rem;width:min(92vw,30rem);text-align:center}
.sp-mark{font-size:.6875rem;letter-spacing:.42em;text-transform:uppercase;color:#7c7469}
.sp-sprite{width:min(62vw,15rem);aspect-ratio:1;background-image:url("img/loader/sheet.png");
  background-size:600% 600%;background-repeat:no-repeat;background-position:0% 0%;
  image-rendering:pixelated;image-rendering:crisp-edges}
.sp-label{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:#fff8df;min-height:1.1em}
.sp-bar{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:min(80vw,22rem)}
.sp-cell{height:.6rem;background:#241110;outline:1px solid #120806}
.sp-cell.on{background:#ef3d1d}
.sp-pct{font-size:.625rem;letter-spacing:.16em;color:#7c7469}
#splash.is-done .sp-label{color:#ffd78d}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
</style>
</head>
<body>

<div id="splash" role="status" aria-live="polite" aria-label="Loading Sauce Day">
  <div class="sp-in">
    <div class="sp-mark">Sauce Day · 2026</div>
    <div class="sp-sprite" aria-hidden="true"></div>
    <div class="sp-label">Selecting tomato</div>
    <div class="sp-bar" aria-hidden="true">
      <i class="sp-cell"></i><i class="sp-cell"></i><i class="sp-cell"></i><i class="sp-cell"></i>
      <i class="sp-cell"></i><i class="sp-cell"></i><i class="sp-cell"></i><i class="sp-cell"></i>
    </div>
    <div class="sp-pct">0%</div>
  </div>
</div>
<script src="js/splash.js"></script>

<div id="demobar" class="demobar" hidden>
  Demo mode — nothing you change here is saved. Fill in <code>js/config.js</code> to go live.
</div>

<div id="gate" class="gate" hidden></div>

<div id="shell" hidden>
  <header class="rule">
    <div class="rulehead">
      <div class="logo"><span class="sig" id="sig"></span><b>Sauce Day</b><em id="edition">2026</em></div>
      <span class="tagline">cut the bad</span>
      <div class="now" id="now"></div>
    </div>
    <nav id="nav" class="grads" aria-label="Sections"></nav>
  </header>

  <div class="frame">
    <aside id="readout" class="readout" aria-label="Live readout"></aside>
    <main id="app" class="panel"></main>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
