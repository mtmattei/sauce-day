<!-- Cache busting. GitHub Pages serves everything with max-age=600 and that
     is not negotiable, so the next best property is atomicity: whichever
     index.html a phone gets, it pulls THAT version's entire module graph —
     never a new app.js over a stale views.js. Every module specifier is
     remapped through this one version stamp; tools/Bump-Version.ps1 rewrites
     the stamps before a deploy. The stamp is the only thing to change. -->
<script type="importmap">
{
  "imports": {
    "./js/app.js":      "./js/app.js?v=202608241146",
    "./js/calc.js":     "./js/calc.js?v=202608241146",
    "./js/charts.js":   "./js/charts.js?v=202608241146",

    "./js/guide.js":    "./js/guide.js?v=202608241146",
    "./js/home.js":     "./js/home.js?v=202608241146",
    "./js/icons.js":    "./js/icons.js?v=202608241146",
    "./js/jars.js":     "./js/jars.js?v=202608241146",
    "./js/stack.js":    "./js/stack.js?v=202608241146",
    "./js/timeline.js": "./js/timeline.js?v=202608241146",
    "./js/ui.js":       "./js/ui.js?v=202608241146",
    "./js/views.js":    "./js/views.js?v=202608241146"
  }
}
</script>

<style>
/* Critical splash CSS, inline so the black paints on the very first frame
   rather than after styles.css lands. Everything else waits its turn. */
#splash{position:fixed;inset:0;z-index:9999;background:#000;color:#fff8df;
  display:grid;place-items:center;padding:1.5rem;
  font-family:"Chivo Mono",ui-monospace,"Courier New",monospace;
  transition:opacity .45s ease,visibility .45s ease}
#splash.is-gone{opacity:0;visibility:hidden;pointer-events:none}
.sp-in{display:grid;justify-items:center;gap:.9rem;width:min(92vw,30rem);text-align:center}
.sp-mark{font-size:.6875rem;letter-spacing:.42em;text-transform:uppercase;color:#7c7469}
.sp-sprite{width:min(62vw,15rem);aspect-ratio:1;background-image:url("img/loader/sheet.png");
  background-size:600% 600%;background-repeat:no-repeat;background-position:0% 0%;
  image-rendering:pixelated;image-rendering:crisp-edges}
.sp-label{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:#fff8df;min-height:1.1em}
.sp-bar{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:min(80vw,22rem)}
.sp-cell{height:.6rem;background:#241110;outline:1px solid #120806}
.sp-cell.on{background:#ef3d1d}
.sp-pct{font-size:.625rem;letter-spacing:.16em;color:#7c7469}
#splash.is-done .sp-label{color:#ffd78d}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
</style>
</head>
<body>

<div id="splash" role="status" aria-live="polite" aria-label="Loading Sauce Day">
  <div class="sp-in">
    <div class="sp-mark">Sauce Day · 2026</div>
    <div class="sp-sprite" aria-hidden="true"></div>
    <div class="sp-label">Selecting tomato</div>
    <div class="sp-bar" aria-hidden="true">
      <i class="sp-cell"></i><i class="sp-cell"></i><i class="sp-cell"></i><i class="sp-cell"></i>
      <i class="sp-cell"></i><i class="sp-cell"></i><i class="sp-cell"></i><i class="sp-cell"></i>
    </div>
    <div class="sp-pct">0%</div>
  </div>
</div>
<script src="js/splash.js?v=202608241146"></script>

<div id="demobar" class="demobar" hidden>

</div>

<!-- A screen that has quietly stopped talking to the database must say so.
     Filled in by app.js from state.error and the realtime channel status.
     role=status so the saying-so reaches screen readers too. -->
<div id="syncbar" class="demobar sync" role="status" aria-live="polite" hidden></div>

<div id="gate" class="gate" hidden></div>

<div id="shell" hidden>
  <h1 class="vh">Sauce Day</h1>
  <header class="rule">
    <div class="rulehead">
      <div class="brand">
        <div class="logo"><span class="sig" id="sig"></span><b>Sauce Da<i>7</i></b><em id="edition">2026</em></div>
        <span class="tagline">cut the bad</span>
      </div>
      <nav id="nav" class="grads" aria-label="Sections"></nav>
      <div class="now" id="now"></div>
      <button id="help" class="helpbtn" title="Find your way — every screen, and what it is for"
              aria-label="Open the guide">?</button>
    </div>
  </header>

  <div class="frame">
    <aside id="readout" class="readout" aria-label="Live readout"></aside>
    <main id="app" class="panel"></main>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js?v=202608241146"></script>
